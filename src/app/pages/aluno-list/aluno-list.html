<div class="card-body p-0"> <div *ngIf="alunos.length > 0; else noData" class="table-responsive"> <table class="table table-striped table-hover align-middle mb-0"> <thead class="table-light">
        <tr>
          <th scope="col" style="width: 8%;">ID</th>
          <th scope="col">Nome Completo</th>
          <th scope="col" style="width: 15%;">Matrícula</th>
          <th scope="col" style="width: 12%;">Prioridade</th>
          <th scope="col" class="text-end" style="width: 15%;">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let aluno of alunos" class="animate__animated animate__fadeIn animate__faster"> <td>{{ aluno.id }}</td>
          <td>{{ aluno.nome }} <span *ngIf="aluno.nomeSocial" class="text-muted small">({{ aluno.nomeSocial }})</span></td>
          <td>{{ aluno.matricula }}</td>
          <td>
            <span class="badge" [ngClass]="aluno.prioridadeAtendimento ? 'bg-warning text-dark' : 'bg-secondary'">
              {{ aluno.prioridadeAtendimento ? 'Sim' : 'Não' }}
            </span>
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary me-2" [routerLink]="['/alunos', aluno.id]" title="Editar Aluno">
              <i class="bi bi-pencil-square"></i>
              <span class="visually-hidden">Editar</span> </button>
            <button class="btn btn-sm btn-outline-danger" (click)="excluir(aluno.id!)" title="Excluir Aluno">
              <i class="bi bi-trash"></i>
              <span class="visually-hidden">Excluir</span> </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #noData>
    <div class="alert alert-light border-start border-4 border-info m-3" role="alert"> <i class="bi bi-info-circle me-2"></i> Nenhum aluno ativo encontrado. Clique em "Novo Aluno" para adicionar.
    </div>
  </ng-template>
</div>

<div class="login-background">
  <div class="login-container">
    <div class="login-card card shadow-lg animate__animated animate__fadeInUp">
      <div class="card-body p-lg-5 p-4">

        <div class="login-header text-center mb-4">
          <h1 class="login-brand-title mb-1">NAAPI</h1>
          <p class="login-brand-subtitle text-muted">Plataforma de Apoio Institucional</p>
          </div>

        <h2 class="card-title text-center mb-4 login-form-title">Acesse sua conta</h2>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <div *ngIf="loginError" class="alert alert-danger d-flex align-items-center alert-sm py-2 mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <div>
              {{ loginError }}
            </div>
          </div>

          <div class="form-floating mb-3">
            <input
              type="email"
              class="form-control"
              id="username"
              placeholder="seu.email@dominio.com"
              formControlName="username"
              required
              autocomplete="username"
              [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            <label for="username">
              <i class="bi bi-envelope-fill text-muted me-2"></i>Email
            </label>
            <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="invalid-feedback">
              Por favor, insira um email válido.
            </div>
          </div>

          <div class="form-floating mb-4">
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Sua senha"
              formControlName="password"
              required
              autocomplete="current-password"
              [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <label for="password">
               <i class="bi bi-lock-fill text-muted me-2"></i>Senha
            </label>
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">
              Senha é obrigatória.
            </div>
          </div>

          <div class="d-grid gap-2 mt-4">
            <button
              type="submit"
              class="btn btn-primary btn-lg btn-login-custom"
              [disabled]="loginForm.invalid">
              <i class="bi bi-box-arrow-in-right me-2"></i> Entrar
            </button>
          </div>

           <p class="mt-4 text-center text-muted small login-help-text">
             (admin@naapi.com / 123456)
           </p>

        </form>
      </div>
    </div>
  </div>
</div>
